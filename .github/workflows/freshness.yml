name: Freshness

# Weekly check of the versioned items that no dependency bot updates (tools pinned by version and checksum),
# listed in .github/freshness.json. Not run on pull requests: an outside release must not fail unrelated changes.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness
  cancel-in-progress: true

jobs:
  freshness:
    name: freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      - name: Test the checker
        run: node --test scripts/check-freshness.test.mjs
      - name: Check pinned versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-freshness.mjs
