name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: the pull request title is checked here too, and a new title must be checked again.
    types: [opened, edited, synchronize, reopened]
  # Weekly run, so new advisories in pip-audit and zizmor surface without a push.
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Downloaded tools are pinned by version and checksum; the weekly freshness job reports newer releases.
env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  LYCHEE_VERSION: 0.24.2
  LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a

jobs:
  check:
    name: check (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report every Python version, not only the first one that fails.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The uv version locked as a dev dependency, which Dependabot's uv updates bump (with their cooldown).
          version-file: uv.lock
          enable-cache: true
      - run: uv sync --locked
      # Node runs markdownlint inside the gate (npx with an exact version).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      # The same command as locally (scripts/gate.py): every code check, each one run even after a failure.
      - name: Gate
        run: uv run python -m scripts.gate
        env:
          # Paths that must never be committed; kept in a repository variable, not in the repository.
          EXCLUDED_PATHS: ${{ vars.EXCLUDED_PATHS }}

      # Security checks do not depend on the Python version; run them once.
      - name: Audit runtime dependencies (pip-audit)
        if: ${{ !cancelled() && matrix.python-version == '3.13' }}
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --progress-spinner off
      - name: Audit workflows (zizmor)
        if: ${{ !cancelled() && matrix.python-version == '3.13' }}
        run: |
          uv run zizmor --no-progress --offline --persona pedantic .
      - name: Lint workflows (actionlint)
        if: ${{ !cancelled() && matrix.python-version == '3.13' }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      # Relative links and their anchors in the tracked Markdown, offline: external sites would make CI flaky.
      - name: Check Markdown links (lychee)
        if: ${{ !cancelled() && matrix.python-version == '3.13' }}
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$archive"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          git ls-files -z '*.md' | xargs -0 "$RUNNER_TEMP/lychee" --offline --include-fragments --no-progress

  conventional-commit:
    name: conventional-commit
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Squash merges use the PR title as the commit subject on main.
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ](.{0,70}[^.])?$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix(scraper): handle empty odds cell' (max 72 chars after the colon, no trailing period). Got: $TITLE"
            exit 1
          fi

  # The only check branch protection requires from this workflow: it passes when every job above passed
  # (the title check is skipped outside pull requests), so job names can change without new settings.
  gate:
    name: gate
    if: ${{ always() }}
    needs: [check, conventional-commit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          CHECK: ${{ needs.check.result }}
          TITLE: ${{ needs.conventional-commit.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "check=$CHECK conventional-commit=$TITLE event=$EVENT"
          [ "$CHECK" = success ] || exit 1
          if [ "$EVENT" = pull_request ]; then [ "$TITLE" = success ] || exit 1; else [ "$TITLE" = skipped ] || exit 1; fi
