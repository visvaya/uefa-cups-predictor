[project]
name = "uefa-cups-predictor"
version = "0.1.0"
description = "League phase analyzer for the UEFA Champions League and Europa League"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.12"
# Lower bounds exclude releases with known advisories; exact versions live in uv.lock.
dependencies = [
    "beautifulsoup4>=4.14",
    "lxml>=6.1",
    "numpy>=2.3",
    "pandas>=2.3",
    "requests>=2.33",
]

[dependency-groups]
# Exact versions keep the quality gate stable: new ruff releases change the default rule set.
dev = [
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
    "types-requests==2.33.0.20260906",
    "zizmor==1.30.1",
]

[tool.uv]
# Scripts run from the repository root; there is nothing to build or install.
package = false
# Supply-chain guard: ignore releases younger than a week (matches the Dependabot cooldown).
exclude-newer = "7 days"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus bug, modernisation, simplification, import order,
# pathlib, blind-except and security (bandit) rules.
extend-select = ["B", "BLE", "I", "PTH", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest assertions

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["analyze.py", "src", "tests", ".agents/hooks/post-edit.py", ".agents/sync-skills.py"]
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
