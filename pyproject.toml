[project]
name = "uefa-cups-predictor"
version = "0.1.0"
description = "League phase analyzer for the UEFA Champions League and Europa League"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
    "mypy>=1.19",
    "types-requests",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".agent", ".serena"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["analyze.py", "src", "tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
