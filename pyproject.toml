[project]
name = "uefa-cups-predictor"
version = "0.1.0"
description = "League phase analyzer for the UEFA Champions League and Europa League"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.12"
# Lower bounds exclude releases with known advisories; exact versions live in uv.lock.
dependencies = [
    "beautifulsoup4>=4.14",
    "lxml>=6.1",
    "numpy>=2.3",
    "pandas>=2.3",
    "requests>=2.33",
]

[dependency-groups]
# Exact versions keep the quality gate stable: new ruff releases change the default rule set.
dev = [
    "hypothesis==6.170.15",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "types-requests==2.33.0.20261030",
    "zizmor==1.32.0",
]

[tool.uv]
# Scripts run from the repository root; there is nothing to build or install.
package = false
# Supply-chain guard: ignore releases younger than a week (matches the Dependabot cooldown).
exclude-newer = "7 days"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus all of pycodestyle (E, W), bug, modernisation, simplification,
# import order, pathlib, blind-except and security (bandit) rules.
extend-select = ["B", "BLE", "E", "I", "PTH", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest assertions

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["analyze.py", "src", "scripts", "tests"]
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# pandas ships no type information (pandas-stubs is not a dependency).
module = "pandas.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["analyze", "src"]
branch = true

[tool.coverage.report]
# Ratchet, not a target. Measured on CI on 2026-11-16 (ubuntu, Python 3.12 and 3.13): 64.57% with
# branch coverage in both runs, after the golden-file tests; one point of margin. Raise it when tests are added.
fail_under = 63
show_missing = true
skip_covered = true
