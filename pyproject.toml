[project]
name = "uefa-cups-predictor"
version = "0.1.0"
description = "League phase analyzer for the UEFA Champions League and Europa League"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.12"
# Lower bounds exclude releases with known advisories; exact versions live in uv.lock.
dependencies = [
    "beautifulsoup4>=4.14",
    "lxml>=6.1",
    "numpy>=2.3",
    "pandas>=2.3",
    "requests>=2.33",
]

[project.scripts]
analyze = "analyzer.cli:run"
soccer-rating = "scraping.soccer_rating_cli:main"

[build-system]
# Fetched at build time; exact pin, released more than a week before adoption (release-age rule).
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Three top-level import names from src/ in one distribution (uv_build supports only package directories).
only-include = ["src/analyzer", "src/scraping", "src/csv_safety.py"]
sources = ["src"]

[dependency-groups]
# Exact versions keep the quality gate stable: new ruff releases change the default rule set.
dev = [
    "hypothesis==6.170.15",
    "import-linter==2.16",
    "mutmut==3.8.1",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pylint==4.1.3",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "types-requests==2.33.0.20261030",
    "uv==0.13.7",  # the uv CI installs: setup-uv reads it from uv.lock, Dependabot keeps it current
    "vulture==2.16",
    "zizmor==1.32.0",
]

[tool.uv]
# `uv sync` installs the project in editable mode (imports `analyzer`, `scraping`, `csv_safety`; console scripts).
package = true
# Supply-chain guard: ignore releases younger than a week (matches the Dependabot cooldown).
exclude-newer = "7 days"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus all of pycodestyle (E, W), bug, modernisation, simplification,
# import order, pathlib, blind-except and security (bandit) rules, and function size limits.
extend-select = [
    "B", "BLE", "C90", "E", "I", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PTH", "RUF", "S", "SIM", "UP", "W",
]

# Size limits: the largest values measured after splitting the analyzer on 2026-11-16 (returns: resolve_url's
# guard clauses). Tighten them when the code allows; never raise them to make a change pass.
[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 6
max-returns = 5
max-statements = 26

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest assertions

[tool.importlinter]
# Layer boundaries: the model and the parsers stay free of I/O, so they remain testable as pure functions.
# Checked by scripts/gate.py; forbidden contracts also catch indirect imports through another module.
# csv_safety is a module, which import-linter cannot take as a root: tests/test_csv_safety.py checks its imports.
root_packages = ["analyzer", "scraping"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Analyzer logic does no I/O"
type = "forbidden"
source_modules = [
    "analyzer.config",
    "analyzer.names",
    "analyzer.model",
    "analyzer.recommendations",
    "analyzer.soccer_rating",
    "analyzer.league",
    "analyzer.sr_only",
]
forbidden_modules = ["analyzer.data", "analyzer.cli", "scraping", "requests"]

[[tool.importlinter.contracts]]
name = "Scraper parsing and filters do no I/O"
type = "forbidden"
source_modules = ["scraping.parsers", "scraping.models", "scraping.match_filters", "scraping.robots"]
forbidden_modules = ["scraping.fetcher", "scraping.soccer_rating_cli", "requests"]

[tool.vulture]
paths = ["analyze.py", "src", "scripts", "tests"]
min_confidence = 80

[tool.pylint.main]
# Only the duplicate-code check runs (ruff covers style and errors); see CONTRIBUTING.md.
disable = "all"
enable = "duplicate-code"

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["analyze.py", "src", "scripts", "tests"]
strict = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
# pandas ships no type information (pandas-stubs is not a dependency).
module = "pandas.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# analyze.py is only the entry point (`main` under `if __name__ == "__main__"`); tests import analyzer directly
source = ["analyzer", "scraping", "csv_safety"]
branch = true

[tool.coverage.report]
# Ratchet, not a target. Measured on CI on 2026-11-16 (ubuntu, Python 3.12 and 3.13): 94.72% with
# branch coverage in both runs, after the scraper golden tests and the src-layout change; about one point of
# margin. Raise it when tests are added, never lower it to make a change pass.
fail_under = 93
show_missing = true
skip_covered = true

[tool.mutmut]
# Scheduled mutation testing (.github/workflows/mutation.yml) of the model rules; Linux only.
source_paths = ["src"]
only_mutate = ["src/analyzer/recommendations.py", "src/analyzer/model.py", "src/analyzer/soccer_rating.py"]
also_copy = ["analyze.py", "data", "scripts"]
mutate_only_covered_lines = true
