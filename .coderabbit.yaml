# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  high_level_summary_in_walkthrough: true
  poem: false
  commit_status: true
  fail_commit_status: true
  auto_review:
    # A paused review still reports a green status, so later fix rounds would merge unreviewed.
    auto_pause_after_reviewed_commits: 0
  path_instructions:
    - path: "**"
      instructions: >-
        Python 3.12+ src-layout package: analyze.py (entry point), src/analyzer (recommendation model),
        src/scraping (soccer-rating.com scraper) and src/csv_safety.py, imported as analyzer, scraping and
        csv_safety.
        Principles: lean code without speculative options; pathlib instead of open(); specific exceptions
        instead of broad ones; every noqa states its reason; no secrets or absolute paths; CSV input through
        read_smart_csv and CSV output through neutralize_formulas; fetched URLs through resolve_url;
        recommendation output stays deterministic and its default format (comma separator, decimal point)
        unchanged; a change to model thresholds or weights also updates README.md and interpretation.md.
        Prefix comments on problems the pull request did not cause with "Pre-existing:". Do not comment on
        what the CI gate already enforces: the steps of scripts/gate.py (ruff check and format, mypy,
        import-linter, vulture, pylint duplicate-code, pytest with the coverage threshold, the tracked-file
        scan, markdownlint-cli2), pip-audit, zizmor, actionlint and the offline lychee link check of the
        Markdown files.
knowledge_base:
  learnings:
    # What the bot learns here stays in this repository.
    scope: local
